<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>POLDERS</title>
    <link rel="icon" type="image/svg+xml" href="./assets/icon.svg" />
    <meta property="og:title" content="POLDERS">
    <meta property="og:image" content="https://geofront.nl/polders/splash.png">
    <meta property="og:description"
        content="Build windmills, dikes, and sluices to keep your feet dry, and expand your settlement from shabby hamlet to a bussling trading city!">
    <meta property="og:url" content="https://geofront.nl">

    <link rel="stylesheet" href="./css/fonts.css">
    <link rel="stylesheet" href="./css/fa.css">

    <style>
        :root {
            --ink: #ffffff;
            --highlight: rgb(220, 188, 187);
            --highlight-dim: rgba(220, 215, 187, 0.45);
            --font-display: 'cool';
            --font-body: 'Montserrat', sans-serif;
        }

        ::selection {
            background: var(--highlight);
            color: #1c1a14;
        }

        .glow {
            display: inline-block;
            transition: transform 0.1s ease-out;
        }

        .glow:hover {
            transform: scale(1.05) rotate(0.01turn);
        }

        .shadowed {
            filter: drop-shadow(0 0 10px rgba(0, 0, 0, 0.8));
        }

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #000;
            color: var(--ink);
            font-family: var(--font-body);
            overflow: hidden;
        }

        .hero {
            position: fixed;
            inset: 0;
            overflow: hidden;
        }

        .hero video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .hero .overlay-image {
            position: absolute;
            inset: 0;
            background-image: url("./polders-background.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.75;
        }

        .hero .overlay-dark {
            position: absolute;
            inset: 0;
            background: linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.6));
        }

        .hero canvas.clouds {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .hero .content {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0 16px;
            box-sizing: border-box;
        }

        .hero .logo {
            height: 26vh;
            max-height: 240px;
            filter: drop-shadow(0 0 10px rgba(0, 0, 0, 0.5));
        }

        .hero .title {
            display: inline-block;
            margin-bottom: 8vh;
        }

        .hero h1 {
            font-family: var(--font-display);
            font-weight: normal;
            font-size: min(14vh, 17vw);
            line-height: 1;
            margin: 0 0 -0.08em 0;
            letter-spacing: 2px;
            color: var(--ink);
        }

        .hero .subtitle {
            display: block;
            font-family: var(--font-body);
            font-weight: 1000;
            font-size: min(2.5vh, 3.5vw);
            font-width: 10px;
            line-height: 0.5;
            letter-spacing: 6px;
            white-space: nowrap;
            text-transform: uppercase;
            color: var(--highlight);
            margin: 0;
            transform: scaleY(0.9);
            transform-origin: top center;
        }

        .hero .links {
            display: flex;
            flex-direction: column;
            gap: 1.5vh;
            align-items: center;
        }

        .hero .links a {
            font-family: var(--font-display);
            font-size: min(3.5vh, 5.5vw);
            color: var(--ink);
            text-decoration: none;
            white-space: nowrap;
        }

        .hero .links a:hover {
            color: var(--highlight);
        }

        .hero .links .fab {
            margin: 0 0.4em;
        }

        .hero .footer {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 2vh;
            text-align: center;
            font-size: 0.85em;
        }

        .hero .footer .copyright {
            margin: 0 0 0.5em 0;
            font-family: var(--font-body);
            font-weight: 400;
            font-size: 0.8em;
            letter-spacing: 0.06em;
            color: rgba(255, 255, 255, 0.85);
        }

        .hero .footer .smallprint {
            font-family: var(--font-display);
            font-size: 0.7em;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .hero .footer .smallprint a {
            color: var(--highlight);
            text-decoration: none;
            padding: 0 0.6em;
            transition: color 0.15s ease-out;
        }

        .hero .footer .smallprint a:hover {
            color: var(--ink);
        }

        .hero .footer .smallprint .sep {
            color: var(--highlight-dim);
        }
    </style>
</head>

<body>
    <section class="hero">
        <video autoplay loop muted playsinline>
            <source src="/polders/assets/gifs/bal.mp4" type="video/mp4">
        </video>
        <div class="overlay-image"></div>
        <div class="overlay-dark"></div>
        <canvas class="clouds"></canvas>

        <div class="content">
            <img class="logo" src="assets/icon.svg" alt="">
            <div class="title shadowed">
                <h1>POLDERS</h1>
                <p class="subtitle">A Dutch City Builder</p>
            </div>

            <div class="links">
                <a class="glow shadowed" href="https://store.steampowered.com/app/3417550/POLDERS">
                    <span class="fab fa-steam"></span>WISHLIST ON STEAM<span class="fab fa-steam"></span>
                </a>
                <a class="glow shadowed" href="https://discord.gg/rz9UBzTtKP">
                    <span class="fab fa-discord"></span>JOIN OUR DISCORD<span class="fab fa-discord"></span>
                </a>
                <a class="glow shadowed" href="https://linktr.ee/POLDERS">
                    &#9776;&nbsp; FOLLOW US &nbsp;&#9776;
                </a>
            </div>
        </div>

        <footer class="footer shadowed">
            <p class="copyright">
                Copyright ©
                <script>document.write(new Date().getFullYear());</script>
                Geofront B.V.
            </p>
            <div class="smallprint">
                <a
                    href="https://drive.google.com/drive/folders/1HwGBLcsQ7jicy_8bDgiBvlIpRxscI8va?usp=sharing">Presskit</a><span
                    class="sep">·</span><a href="/polders/privacy/privacy.html">Privacy Policy</a><span
                    class="sep">·</span><a href="/polders/troubleshooting/troubleshooting.html">Troubleshooting</a>
            </div>
        </footer>

        <script src="./js/clouds.js"></script>
        <script src="./js/parallax.js"></script>
    </section>
</body>

</html>
